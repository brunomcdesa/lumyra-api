spring:
  application:
    name: lumyra-api
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  auth:
    rate-limit:
      max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
  invite:
    expiration-hours: ${INVITE_EXPIRATION_HOURS:72}
    base-url: ${INVITE_BASE_URL:https://app.lumyra.com.br/aceitar-convite?token=}
  lgpd:
    terms-version: ${LGPD_TERMS_VERSION:1.0}
    retention-days: ${LGPD_RETENTION_DAYS:30}
    purge-cron: ${LGPD_PURGE_CRON:0 0 3 * * *}
